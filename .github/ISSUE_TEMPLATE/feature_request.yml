name: 💡 Feature Request
description: Suggest an idea or feature request for this action
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: checkboxes
    id: terms
    attributes:
      label: Check for duplicate issues
      description: Check [issues](https://github.com/glueckkanja/action-epoch-semantic-version/issues?q=is%3Aissue%20label%3A%22feature%20request%22) for similar feature requests.
      options:
        - label: I have verified that this feature has not been requested before
          required: true
  - type: textarea
    id: feature-description
    attributes:
      label: What should be added or changed?
      description: Please describe your feature request in as much detail as possible.
      placeholder: Feature request
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: If applicable, provide additional context, screenshots, or mock-ups.
    validations:
      required: false
