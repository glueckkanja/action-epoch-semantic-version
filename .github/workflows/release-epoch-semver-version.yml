name: Release Epoch Semver Version

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      create_tag:
        description: "Create a Git tag and release"
        default: false
        type: boolean
      is_prerelease:
        description: "Create a prerelease version"
        default: false
        type: boolean

permissions:
  contents: write # needed for the epoch-semver action (create tag and release)

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      bump_type: ${{ steps.version.outputs.bump_type }}
      previous_tag: ${{ steps.version.outputs.previous_tag }}
      commit_subject: ${{ steps.version.outputs.commit_subject }}
      release_id: ${{ steps.version.outputs.release_id }}
    steps:
      - name: Generate epoch semantic version
        id: version
        uses: glueckkanja/action-semantic-version@b413070dd1f039b1fbfda9f402dd52d602879fb3 # v5.0.0
        with:
          prerelease_name: "prerelease"
          github_token: ${{ secrets.GITHUB_TOKEN }}
          suppress_tag: ${{ ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.create_tag)) != true }}
          is_prerelease: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.is_prerelease) }}
